<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌻</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#FAF7F2;

font-family:Arial,Helvetica,sans-serif;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:#555;

}

.screen{

position:absolute;

width:100%;

height:100%;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

transition:.6s;

}

.hidden{

opacity:0;

pointer-events:none;

}

.sunflower{

font-size:90px;

cursor:pointer;

transition:.3s;

}

.sunflower:active{

transform:scale(1.15);

}

.title{

margin-top:25px;

font-size:22px;

font-weight:bold;

}

.small{

margin-top:12px;

font-size:15px;

opacity:.7;

}

</style>

</head>

<body>

<div id="page1" class="screen">

<div class="sunflower" onclick="nextPage()">

🌻

</div>

<div class="title">

pls bear with my ka-cornyhan.

</div>

<div class="small">

one tap.

</div>

</div>

<script>

function nextPage(){

document.getElementById("page1").classList.add("hidden");

}

</script>

</body>
</html>
